<section class="contact" id="contact">
  <div class="contact-header">
    <div class="contact-title">
      <span class="eyebrow">CONTACT</span>
      <h2>Let's build together.</h2>
    </div>
  </div>

  <div class="contact-content">
    <div class="contact-message">
      <p>
        I'm open to discussing new opportunities, interesting projects, and collaborations where
        technology can create meaningful impact.
      </p>
      <a class="contact-cta" href="mailto:your-email@example.com">
        START A CONVERSATION
        <span>↗</span>
      </a>
    </div>

    <div class="contact-details">
      @for (link of contactLinks; track link.label) {
        <a class="contact-item" [href]="link.href" target="_blank" rel="noopener noreferrer">
          <span class="contact-label">
            {{ link.label }}
          </span>
          <span class="contact-value">
            {{ link.value }}
          </span>
          <span class="contact-arrow">↗</span>
        </a>
      }

      <div class="contact-item location">
        <span class="contact-label"> Location </span>
        <span class="contact-value"> Hyderabad, India </span>
      </div>
    </div>
  </div>
</section>
